baseURL = "https://aominhtam.github.io/fcaj-workshop-template/"
languageCode = "vi"
defaultContentLanguage = "vi"
defaultContentLanguageInSubdir = false
title = "Báo cáo thực tập FCAJ - Ao Minh Tâm"
theme = "hugo-theme-learn"

[params]
  themeVariant = "workshop"
  description = "Workforce Bootcamp - First Cloud AI Journey (FCAJ) Internship Portfolio"
  author = "Ao Minh Tâm"
  showVisitedLinks = true
  disableBreadcrumb = false
  disableNextPrev = false

[Languages]
[Languages.vi]
  title = "Báo cáo thực tập FCAJ"
  weight = 1
  languageName = "Tiếng Việt"
